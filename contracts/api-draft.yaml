openapi: 3.0.3
info:
  title: Scholarship AI illustrative API contract
  version: 0.2.0-draft
  description: |
    팀 승인 전 개념 계약. 실제 엔드포인트가 존재한다고 주장하지 않는다.
    MVP(#23, 2026-11-18): `x-mvp: true` 표시한 4개 경로만 먼저 구현한다(로그인·DB 없음, TEST_ONLY fixture).
    예제 응답은 examples/api/*.json 이며 backend/tests/test_contract_examples.py가 이 스키마로 검사한다.
    업무 규칙 원본: docs/01-domain/04-business-rules.md
    평가 계산 원본: docs/01-domain/05-eligibility-policy.md
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /notices:
    get:
      x-mvp: true
      tags: [Notice]
      summary: 검증된 공고 목록 조회 (FR-B03) — VERIFIED 공고만 반환 (BR-A05)
      parameters:
        - name: group
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EligibilityGroup'
      responses:
        '200':
          description: 사용자에게 공개 가능한 검증된 공고 목록 (초안)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoticeSummary'
  /notices/{noticeId}:
    get:
      tags: [Notice]
      x-mvp: true
      summary: 공고 원문·공식성·버전·근거 상세 (FR-B04)
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: 공고 상세와 조건별 원문 근거
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDetail'
        '404':
          description: 없는 공고 또는 미검증 공고 (검증된 공고처럼 보이지 않게 함, BR-A05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
  /assessments:
    post:
      x-mvp: true
      tags: [Eligibility]
      summary: 검증된 RuleSet과 학생 사실로 3값 판정
      description: |
        응답 정책(#23 결정):
        - 공고 버전이 VERIFIED가 아니면 409 `NOTICE_NOT_VERIFIED` — 미검증 공고는 판정 대상이 아님(BR-A05).
        - VERIFIED 공고인데 규칙이 비었거나 평가할 수 없으면 200 + `NEEDS_REVIEW`,
          조건 reasonCode `RULE_UNVERIFIED`/`UNSUPPORTED_OPERATOR` — `ELIGIBLE` 생성 금지(BR-B09, AC-B05).
        - 모름은 `isKnown: false`, `value: null` (0/false 금지, BR-B01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequest'
      responses:
        '200':
          description: 조건별 판정과 원문 근거를 포함한 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '409':
          description: 새 공고 버전 또는 검증 미완료 - 확정 가능 결과를 내지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
  /preparation-summaries:
    post:
      x-mvp: true
      tags: [Preparation]
      summary: MVP 신청 준비 요약 — 체크리스트·공식 제출 안내 (준비 건을 만들지 않음, 저장 없음)
      description: |
        MVP 전용. P2에서 비동기 `/preparations`로 대체한다.
        판정은 서버가 Rule Engine으로 다시 계산해 준비 상태를 정한다:
        ELIGIBLE → PREPARED, NEEDS_REVIEW → PREPARED_WITH_OPEN_ITEMS, INELIGIBLE → STOPPED (BR-C02, BR-C04).
        `SUBMITTED` 같은 제출 상태는 없다 — 공식 제출은 학생이 직접 한다 (BR-C07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequest'
      responses:
        '200':
          description: 준비 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationSummary'
        '409':
          description: 미검증 공고
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
  /preparations:
    post:
      tags: [Preparation]
      summary: 신청 준비 건 접수(실제 작성 완료와 다름)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noticeId, expectedNoticeVersionId]
              properties:
                noticeId:
                  type: string
                expectedNoticeVersionId:
                  type: string
      responses:
        '202':
          description: 비동기 작업 접수(준비 완료가 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationReceipt'
        '409':
          description: 공고 변경/중복 정책 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
  /preparations/{caseId}:
    get:
      tags: [Preparation]
      summary: 본인 준비 건의 진행 상황과 대기 질문 조회
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: 보존된 업무 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationState'
        '403':
          description: 다른 학생의 자료 접근 금지
  /preparations/{caseId}/answers:
    post:
      tags: [Preparation]
      summary: 기존 준비 건의 질문에 답하고 이어가기
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answerStatus]
              properties:
                questionId:
                  type: string
                answerStatus:
                  type: string
                  enum: [ANSWERED, UNKNOWN, NEEDS_INSTITUTION]
                answer:
                  nullable: true
                  description: 타입/연도/단위를 포함하는 사실 객체; UNKNOWN이면 null
                  $ref: '#/components/schemas/StudentFact'
      responses:
        '202':
          description: 같은 case에 답변 접수/실행 재개 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationReceipt'
  /admin/reviews/{reviewId}/decisions:
    post:
      tags: [Review]
      summary: 관리자 원문-추출 정합성 결정(기관 심사 결정 아님)
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noticeVersionId, decision, reason, evidenceId]
              properties:
                noticeVersionId:
                  type: string
                decision:
                  type: string
                  enum: [APPROVE, CORRECT, REJECT]
                correctedRuleCandidate:
                  nullable: true
                  type: object
                  additionalProperties: true
                evidenceId:
                  type: string
                reason:
                  type: string
      responses:
        '202':
          description: 내부 검토 결정 반영 및 재개 접수
        '403':
          description: 관리자 권한 없음
  /notifications:
    get:
      tags: [Notification]
      summary: 학생 본인 알림함 (외부 푸시 결과와 별개)
      responses:
        '200':
          description: 최신/구버전 여부를 알 수 있는 알림 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [notificationId, noticeVersionId, eventType, createdAt]
                  properties:
                    notificationId: {type: string}
                    noticeVersionId: {type: string}
                    eventType: {type: string, enum: [NEW_NOTICE, CHANGED_NOTICE]}
                    createdAt: {type: string, format: date-time}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema: {type: string}
    CaseId:
      name: caseId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string}
  schemas:
    EligibilityGroup:
      type: string
      enum: [ELIGIBLE, INELIGIBLE, NEEDS_REVIEW]
    RuleResult:
      type: string
      enum: [PASS, FAIL, UNKNOWN]
    VerificationStatus:
      type: string
      enum: [CANDIDATE, EXTRACTING, REVIEW_PENDING, VERIFIED, REJECTED]
    FreshnessStatus:
      type: string
      enum: [UNCHECKED, CHECKED_UNCHANGED, CHECKED_CHANGED, CHECK_FAILED]
    ReasonCode:
      type: string
      description: 조건별 결과의 이유 (05-eligibility-policy §2 초안)
      enum: [EVALUATED, VALUE_MISMATCH, MISSING_FACT, INSTITUTION_CONFIRMATION, RULE_UNVERIFIED, UNSUPPORTED_OPERATOR]
    EvidenceRef:
      type: object
      required: [evidenceId, noticeVersionId, fileId, location, quote]
      properties:
        evidenceId: {type: string}
        noticeVersionId: {type: string}
        fileId: {type: string}
        location:
          type: string
          description: 페이지 또는 문장/표/텍스트 span 참조
        quote:
          type: string
          description: 공식 원문 문장 그대로 (FR-B04)
        officialUrl: {type: string, format: uri, nullable: true}
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: 원문을 마지막으로 성공 확인한 시각. 없으면 근거 미완결(AC-B09)
        verifiedAt: {type: string, format: date-time, nullable: true}
    NoticeSummary:
      type: object
      required: [noticeId, noticeVersionId, title, institution, sourceVerificationStatus, freshnessStatus, isTestOnly]
      properties:
        noticeId: {type: string}
        noticeVersionId: {type: string}
        title: {type: string}
        institution: {type: string}
        isTestOnly:
          type: boolean
          description: TEST_ONLY 가상 공고 여부. true면 화면에 표시하고 검색 노출 금지
        officialUrl: {type: string, format: uri, nullable: true}
        sourceVerificationStatus: {$ref: '#/components/schemas/VerificationStatus'}
        freshnessStatus: {$ref: '#/components/schemas/FreshnessStatus'}
        lastCheckedAt: {type: string, format: date-time, nullable: true}
        recruitmentStartAt: {type: string, format: date-time, nullable: true}
        recruitmentEndAt: {type: string, format: date-time, nullable: true}
    NoticeCondition:
      type: object
      required: [conditionId, label, evidence]
      properties:
        conditionId: {type: string}
        label:
          type: string
          description: 사람이 읽는 조건 표현 (예 "2학년 이상")
        evidence:
          $ref: '#/components/schemas/EvidenceRef'
    NoticeDetail:
      type: object
      required: [notice, conditions]
      properties:
        notice: {$ref: '#/components/schemas/NoticeSummary'}
        conditions:
          type: array
          description: 판정 전에도 보는 원문 조건 목록. OR 묶음 구조 표시는 판정 결과에서
          items: {$ref: '#/components/schemas/NoticeCondition'}
    StudentFact:
      type: object
      required: [field, isKnown]
      properties:
        field: {type: string}
        isKnown: {type: boolean}
        value:
          nullable: true
          description: 숫자/문자열/열거형 값. 단위와 기준일 확인 전 추측 금지
        unit: {type: string, nullable: true}
        effectiveAt: {type: string, format: date-time, nullable: true}
        source: {type: string, enum: [STUDENT_PROVIDED, USER_CONFIRMED]}
    AssessmentRequest:
      type: object
      required: [noticeVersionId, facts]
      properties:
        noticeVersionId: {type: string}
        facts:
          type: array
          items:
            $ref: '#/components/schemas/StudentFact'
    ConditionEvaluation:
      type: object
      required: [conditionId, label, result, reasonCode, evidence, missingEvidenceFields]
      properties:
        conditionId: {type: string}
        label: {type: string}
        result: {$ref: '#/components/schemas/RuleResult'}
        reasonCode: {$ref: '#/components/schemas/ReasonCode'}
        evidence:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EvidenceRef'
        missingEvidenceFields:
          type: array
          description: 비어 있지 않으면 '근거 검증 완료'로 표시하지 않는다 (AC-B09)
          items: {type: string, enum: [evidence, noticeVersionId, checkedAt]}
        studentFactRef: {type: string, nullable: true}
    AssessmentResult:
      type: object
      required: [assessmentId, noticeVersionId, eligibilityResult, details, assessedAt, isStale, evidenceComplete]
      properties:
        assessmentId: {type: string}
        noticeVersionId: {type: string}
        eligibilityResult: {$ref: '#/components/schemas/EligibilityGroup'}
        evidenceComplete:
          type: boolean
          description: 모든 조건의 근거·버전·확인 시각이 있을 때만 true
        details:
          type: array
          items:
            $ref: '#/components/schemas/ConditionEvaluation'
        assessedAt: {type: string, format: date-time}
        isStale: {type: boolean}
        warning: {type: string, nullable: true}
    ChecklistItem:
      type: object
      required: [itemId, documentName, reason, isConditional, issuer, issuanceGuideUrl, evidence]
      properties:
        itemId: {type: string}
        documentName: {type: string}
        reason:
          type: string
          description: 왜 필요한지 — 원문 근거 요약
        isConditional:
          type: boolean
          description: true면 "해당하는 경우"만 필요 (모든 학생에게 강제 금지)
        appliesWhen: {type: string, nullable: true}
        issuer:
          type: string
          nullable: true
          description: null이면 화면에 "발급처 확인 필요" (발급처 창작 금지)
        issuanceGuideUrl:
          type: string
          format: uri
          nullable: true
          description: 검증된 공식 안내 URL만. 없으면 null
        evidence: {$ref: '#/components/schemas/EvidenceRef'}
    OpenItem:
      type: object
      required: [conditionId, label, reasonCode]
      properties:
        conditionId: {type: string}
        label: {type: string}
        reasonCode: {$ref: '#/components/schemas/ReasonCode'}
    PreparationSummary:
      type: object
      description: MVP 준비 요약. 업로드·제출 기능 없음 (BR-C07, BR-C08)
      required: [noticeId, noticeVersionId, eligibilityResult, preparationStatus, checklist, openItems, failedConditions, officialSubmissionUrl]
      properties:
        noticeId: {type: string}
        noticeVersionId: {type: string}
        eligibilityResult: {$ref: '#/components/schemas/EligibilityGroup'}
        preparationStatus:
          type: string
          enum: [PREPARED, PREPARED_WITH_OPEN_ITEMS, STOPPED]
        checklist:
          type: array
          description: STOPPED면 빈 배열
          items: {$ref: '#/components/schemas/ChecklistItem'}
        openItems:
          type: array
          description: 미확인 조건 (PREPARED_WITH_OPEN_ITEMS일 때)
          items: {$ref: '#/components/schemas/OpenItem'}
        failedConditions:
          type: array
          description: 확정 FAIL 조건과 근거 (STOPPED일 때)
          items: {$ref: '#/components/schemas/ConditionEvaluation'}
        officialSubmissionUrl:
          type: string
          format: uri
          nullable: true
          description: 학생이 직접 제출할 공식 경로
    PreparationReceipt:
      type: object
      required: [caseId, accepted, executionStatus]
      properties:
        caseId: {type: string}
        accepted: {type: boolean}
        executionStatus:
          type: string
          enum: [QUEUED, RUNNING, INTERRUPTED, SUCCEEDED, FAILED]
        message: {type: string}
    PreparationState:
      type: object
      required: [caseId, noticeVersionId, preparationStatus, executionStatus, outstandingQuestions]
      properties:
        caseId: {type: string}
        noticeVersionId: {type: string}
        preparationStatus:
          type: string
          enum: [CREATED, CHECKING, WAITING_STUDENT, WAITING_ADMIN, DRAFTING, PREPARED, PREPARED_WITH_OPEN_ITEMS, STOPPED]
        executionStatus:
          type: string
          enum: [QUEUED, RUNNING, INTERRUPTED, SUCCEEDED, FAILED]
        outstandingQuestions:
          type: array
          items:
            type: object
            required: [questionId, questionText, reasonCode]
            properties:
              questionId: {type: string}
              questionText: {type: string}
              reasonCode: {type: string}
              relatedRuleId: {type: string, nullable: true}
        outstandingInstitutionConfirmations:
          type: array
          items: {type: string}
        downloadUrl:
          type: string
          nullable: true
          format: uri
          description: 권한 확인 후 발급한 짧은 수명 URL, 없으면 null
    DomainError:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          description: 예 NOTICE_NOT_VERIFIED, NOTICE_NOT_FOUND, NOTICE_VERSION_MISMATCH
        message: {type: string}
        traceId: {type: string}
        noticeVersionId: {type: string, nullable: true}
