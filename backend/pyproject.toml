[project]
name = "scholarship-backend"
version = "0.1.0"
description = "Scholarship AI backend (FastAPI). Rule Engine lives in app/eligibility/domain/rules.py only."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# hook(저장소 루트에서 실행)과 컨테이너(backend/)에서 같은 정렬 결과가 나오게 고정
known-first-party = ["app", "tests"]
